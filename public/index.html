<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Sync</title>
    <style>
        body { background: #0b141a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #videoPlayer { width: 100%; max-width: 800px; border-radius: 10px; background: black; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        #status { color: #00a884; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>
    <h2>Sovereign Sync P2P</h2>
    <input type="file" id="fileInput" accept="video/mp4">
    <video id="videoPlayer" controls playsinline webkit-playsinline></video>
    
    <div class="controls">
        <input id="remoteId" placeholder="Arkadaşın ID'sini gir">
        <button onclick="connect()">Bağlan</button>
    </div>
    <p>Senin ID: <b id="myId">...</b> | <span id="status">Bağlantı yok</span></p>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const video = document.getElementById('videoPlayer');
        const peer = new Peer();
        let conn;

        peer.on('open', id => document.getElementById('myId').innerText = id);

        document.getElementById('fileInput').onchange = e => {
            video.src = URL.createObjectURL(e.target.files[0]);
        };

        function connect() {
            conn = peer.connect(document.getElementById('remoteId').value);
            setupConn();
        }

        peer.on('connection', c => { conn = c; setupConn(); });

        let isRemoteUpdate = false; // "Bu komut ağdan geldi, kendi kendine tekrar etme" bayrağı

        function setupConn() {
            conn.on('open', () => document.getElementById('status').innerText = "BAĞLANDI!");
            conn.on('data', data => {
                isRemoteUpdate = true; // Komutun ağdan geldiğini işaretle
                
                if (data.type === 'PLAY') { video.currentTime = data.time; video.play(); }
                if (data.type === 'PAUSE') { video.pause(); video.currentTime = data.time; }
                if (data.type === 'SEEK') { video.currentTime = data.time; }
                
                // İşlem bittikten kısa süre sonra bayrağı sıfırla
                setTimeout(() => isRemoteUpdate = false, 500);
            });
        }

        // Sadece KULLANICI tıklarsa gönder (Ağdan gelen güncellemeyi gönderme!)
        video.onplay = () => {
            if (!isRemoteUpdate && conn && conn.open) conn.send({ type: 'PLAY', time: video.currentTime });
        };
        
        video.onpause = () => {
            if (!isRemoteUpdate && conn && conn.open) conn.send({ type: 'PAUSE', time: video.currentTime });
        };
        
        video.onseeked = () => {
            if (!isRemoteUpdate && conn && conn.open) conn.send({ type: 'SEEK', time: video.currentTime });
        };
        // 3 saniyede bir çok hafif kontrol
        setInterval(() => {
            if (conn && conn.open) {
                conn.send({ type: 'HEARTBEAT', time: video.currentTime });
            }
        }, 3000);
    </script>
</body>
</html>
